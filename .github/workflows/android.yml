name: Honda OBD Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Honda OBD APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          echo "Java version:"
          java -version

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in the repository root."
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::The ZIP does not contain gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Accept Android SDK licenses
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found at standard paths; Gradle will attempt to use the installed SDK."
          fi

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find extracted -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no debug APK was found."
            exit 1
          fi

          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Honda-OBD-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
