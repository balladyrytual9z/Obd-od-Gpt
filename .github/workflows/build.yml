name: Honda OBD - build every uploaded version

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: honda-obd-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select project source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/honda-source" "$GITHUB_WORKSPACE/dist"

          # Wybierz najwyższą semver spośród Honda-OBD-Discovery-X.Y.Z*.zip
          mapfile -t ZIP_CANDIDATES < <(
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
              -name 'Honda-OBD-Discovery-*.zip' \
              ! -path '*/.git/*' \
              | grep -E 'Honda-OBD-Discovery-[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V \
              || true
          )
          ZIP_FILE="${ZIP_CANDIDATES[-1]:-}"

          if [[ -n "$ZIP_FILE" ]]; then
            echo "Building source archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/honda-source"
            PROJECT_DIR="$(find "$RUNNER_TEMP/honda-source" -type f -name gradlew -print -quit | xargs -r dirname)"
            if [[ -z "${PROJECT_DIR:-}" || ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
              echo "Could not find gradlew and app/build.gradle.kts in selected ZIP." >&2
              exit 1
            fi
            cp "$ZIP_FILE" "$GITHUB_WORKSPACE/dist/Honda-OBD-Discovery-source-${GITHUB_RUN_NUMBER}.zip"
          elif [[ -f "$GITHUB_WORKSPACE/gradlew" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/Honda-OBD-Discovery-source-${GITHUB_RUN_NUMBER}.zip" . \
              -x './.git/*' './.gradle/*' './app/build/*' './dist/*' './.github/*')
          else
            echo "No versioned Honda-OBD-Discovery-*.zip or Android project found." >&2
            echo "Upload the source ZIP to the repository root, and place this workflow in .github/workflows/android.yml." >&2
            exit 1
