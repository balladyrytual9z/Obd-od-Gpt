name: Honda OBD - Build from ZIP

on:
workflow_dispatch:
push:
paths:
- “**.zip”
- “.github/workflows/build.yml”

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Find and extract project archive
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$GITHUB_WORKSPACE/extracted"
      ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
        -maxdepth 2 -type f -iname '*.zip' \
        ! -path '*/.git/*' \
        ! -path '*/extracted/*' \
        | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "::error::Nie znaleziono archiwum ZIP w repozytorium."
        echo "Wgraj ZIP z projektem Androida i uruchom workflow ponownie."
        exit 1
      fi
      echo "Archiwum: $ZIP_FILE"
      unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
      PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
        -type f \( \
          -name 'gradlew' -o \
          -name 'settings.gradle' -o \
          -name 'settings.gradle.kts' \
        \) \
        -printf '%h\n' \
        | sort -u \
        | while read -r dir; do
            if [ -f "$dir/gradlew" ] && \
               { [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; }; then
              echo "$dir"
              break
            fi
          done)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "::error::W ZIP-ie nie znaleziono projektu z gradlew i settings.gradle(.kts)."
        echo "Sprawdź, czy archiwum zawiera kompletny projekt Android Studio wraz z Gradle Wrapper."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Znaleziony projekt: $PROJECT_DIR"
  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
  - name: Prepare Gradle Wrapper
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -euo pipefail
      chmod +x ./gradlew
      ./gradlew --version
  - name: Build debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -euo pipefail
      ./gradlew --no-daemon assembleDebug
  - name: Upload APK artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: Honda-OBD-APK
      path: |
        extracted/**/*.apk
      if-no-files-found: warn
      retention-days: 14
