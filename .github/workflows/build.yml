name: Honda OBD - build every uploaded version

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: honda-obd-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select project source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/honda-source" "$GITHUB_WORKSPACE/dist"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
            -name 'Honda-OBD-Discovery-*.zip' \
            ! -path '*/.git/*' \
            | grep -E 'Honda-OBD-Discovery-[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Building source archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/honda-source"
            PROJECT_DIR="$(find "$RUNNER_TEMP/honda-source" -type f -name gradlew -print -quit | xargs -r dirname)"
            if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "Could not find gradlew and app/build.gradle.kts in selected ZIP." >&2
              exit 1
            fi
            cp "$ZIP_FILE" "$GITHUB_WORKSPACE/dist/Honda-OBD-Discovery-source-${GITHUB_RUN_NUMBER}.zip"
          elif [ -f "$GITHUB_WORKSPACE/gradlew" ] && [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/Honda-OBD-Discovery-source-${GITHUB_RUN_NUMBER}.zip" . \
              -x './.git/*' './.gradle/*' './app/build/*' './dist/*' './.github/*')
          else
            echo "No versioned Honda-OBD-Discovery-*.zip or Android project found." >&2
            echo "Upload the source ZIP to the repository root, and place this workflow in .github/workflows/android.yml." >&2
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Using project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assign unique installable build version
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" "$GITHUB_RUN_NUMBER" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          run_number = int(sys.argv[2])
          text = path.read_text(encoding="utf-8")
          if not re.search(r"versionCode\s*=\s*\d+", text):
              raise SystemExit("versionCode declaration not found")
          text = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {run_number}", text, count=1)
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          base = match.group(1).split("+build.")[0] if match else "0.8.3"
          if match:
              text = text[: match.start()] + f'versionName = "{base}+build.{run_number}"' + text[match.end() :]
          path.write_text(text, encoding="utf-8")
          print(f"CI versionCode={run_number}; versionName={base}+build.{run_number}")
          PY

      - name: Validate wrapper and run unit tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew test --stacktrace

      - name: Build APK for Android 9 and newer
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare versioned download files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "${APK:-}" ]; then
            echo "APK output missing" >&2
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/dist/Honda-OBD-Discovery-build-${GITHUB_RUN_NUMBER}.apk"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.apk *.zip > SHA256SUMS.txt)
          printf 'Build number: %s\nCommit: %s\nSource: %s\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "${{ github.ref_name }}" \
            > "$GITHUB_WORKSPACE/dist/BUILD-INFO.txt"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honda-OBD-Discovery-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish a permanent versioned GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}-{1}', github.run_number, github.run_attempt) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Honda OBD build {0}', github.run_number) }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.zip
            dist/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
