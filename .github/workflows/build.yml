name: Build APK from uploaded ZIP and create Release

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Optional path to a ZIP in the repository (e.g. ESSGOO-Quick-Switch-Liquid-Glass-Animated.zip). Leave empty to use the latest ZIP changed in the last commit.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zip-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Select ZIP to build
        id: select
        shell: bash
        env:
          MANUAL_ZIP: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_ZIP:-}" ]]; then
            [[ -f "$MANUAL_ZIP" ]] || { echo "ZIP not found: $MANUAL_ZIP"; exit 1; }
            ZIP_PATH="$MANUAL_ZIP"
          else
            ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.zip' | head -n 1 || true)"
            if [[ -z "$ZIP_PATH" ]]; then
              ZIP_PATH="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- | sed 's#^\./##')"
            fi
            [[ -n "$ZIP_PATH" && -f "$ZIP_PATH" ]] || { echo 'No ZIP found. Upload a source-project ZIP to the repository root or run workflow_dispatch with zip_path.'; exit 1; }
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Selected project archive: $ZIP_PATH"

      - name: Extract project ZIP
        id: extract
        shell: bash
        env:
          ZIP_PATH: ${{ steps.select.outputs.zip_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/apk-output"
          unzip -q "$GITHUB_WORKSPACE/$ZIP_PATH" -d "$RUNNER_TEMP/source"
          # Find the project root, including archives that contain a top-level folder.
          PROJECT_ROOT="$(find "$RUNNER_TEMP/source" -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort | head -n 1)"
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo 'Could not find gradlew or settings.gradle(.kts) inside the ZIP.'
            echo 'The ZIP must contain an Android Gradle project, not only an APK or source snippets.'
            exit 1
          fi
          # Prefer the directory containing gradlew when it exists.
          WRAPPER="$(find "$PROJECT_ROOT" -maxdepth 1 -type f -name gradlew -print -quit)"
          if [[ -z "$WRAPPER" ]]; then
            WRAPPER="$(find "$RUNNER_TEMP/source" -type f -name gradlew -print -quit)"
            [[ -n "$WRAPPER" ]] && PROJECT_ROOT="$(dirname "$WRAPPER")"
          fi
          [[ -n "$WRAPPER" ]] || { echo 'No Gradle wrapper (gradlew) found. Add the Gradle wrapper to the project ZIP.'; exit 1; }
          chmod +x "$WRAPPER"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_ROOT"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.extract.outputs.project_root }}
          ZIP_PATH: ${{ steps.select.outputs.zip_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew --no-daemon --stacktrace assembleDebug
          mapfile -t APKS < <(find . -type f -path '*/build/outputs/apk/*/*.apk' -name '*debug*.apk' | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            mapfile -t APKS < <(find . -type f -path '*/build/outputs/apk/*/*.apk' | sort)
          fi
          [[ ${#APKS[@]} -gt 0 ]] || { echo 'Gradle finished but no APK was found in build/outputs/apk.'; exit 1; }
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            cp "$apk" "$RUNNER_TEMP/apk-output/$base"
          done
          cp "$GITHUB_WORKSPACE/$ZIP_PATH" "$RUNNER_TEMP/apk-output/source-project.zip"
          ls -lh "$RUNNER_TEMP/apk-output"

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        env:
          ZIP_PATH: ${{ steps.select.outputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP_BASE="$(basename "$ZIP_PATH" .zip | tr ' ' '-' | tr -cd '[:alnum:]_.-')"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="auto-${ZIP_BASE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=APK build: $ZIP_BASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/apk-output/*.apk
            ${{ runner.temp }}/apk-output/source-project.zip
          body: |
            Automatically built from `${{ steps.select.outputs.zip_path }}`.

            Build command: `./gradlew --no-daemon assembleDebug`

            **Note:** This release is created only if the Gradle build succeeds. The APK is a debug build and is not a Play Store release build.
