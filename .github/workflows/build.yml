name: Honda OBD Discovery Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build both APKs
        run: ./gradlew :app:assembleDebug :dtcclear:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Honda-OBD-Discovery-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            dtcclear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
